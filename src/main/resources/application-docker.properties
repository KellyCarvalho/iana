spring.application.name=iana
server.address=0.0.0.0
server.port=${PORT:8080}
spring.main.lazy-initialization=true

# Cloud / Docker Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/ianadb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:iana}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ianapass}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 Console in Docker/Prod
spring.h2.console.enabled=false

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
spring.kafka.consumer.group-id=iana-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.iana.*
spring.kafka.listener.auto-startup=${SPRING_KAFKA_LISTENER_AUTO_STARTUP:false}

# Spring Cloud auto-configurations override
spring.cloud.config.enabled=false
eureka.client.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:iana-default-secret-key-with-at-least-32-bytes-length-2026}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# AI Content & Link Moderation (Google Gemini API)
ai.moderation.gemini-api-key=${GEMINI_API_KEY:}
ai.moderation.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}

# Email / SMTP Configuration (Gmail ou outro provedor SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


