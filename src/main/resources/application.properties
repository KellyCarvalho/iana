spring.application.name=iana
server.port=${PORT:8080}

# Database Configuration (Usa SPRING_DATASOURCE_URL se definido, ou H2 persistente local por padrão)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ianadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Spring Cloud auto-configurations override for local standalone execution
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Kafka Messaging Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=iana-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.iana.*
spring.kafka.listener.auto-startup=false

# JWT Configuration
jwt.secret=${JWT_SECRET:iana-default-secret-key-with-at-least-32-bytes-length-2026}
jwt.expiration-seconds=3600

# AI Content & Link Moderation (Google Gemini API)
ai.moderation.gemini-api-key=${GEMINI_API_KEY:}
ai.moderation.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}

# Email / SMTP Configuration (Gmail ou outro provedor SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
