spring.application.name=iana
server.port=${PORT:8080}

# Database Configuration (H2 Persistent File Database)
spring.datasource.url=jdbc:h2:file:./data/ianadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Cloud auto-configurations override for local standalone execution
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Kafka Messaging Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=iana-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.iana.*
spring.kafka.listener.auto-startup=false

# JWT Configuration
jwt.secret=${JWT_SECRET:iana-default-secret-key-with-at-least-32-bytes-length-2026}
jwt.expiration-seconds=3600

# AI Content & Link Moderation (Google Gemini API)
ai.moderation.gemini-api-key=${GEMINI_API_KEY:}
ai.moderation.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
